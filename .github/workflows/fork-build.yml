name: Fork build

# A FORK-ONLY workflow (not for upstream): builds an installable nightly-flavour .ipk of this branch
# on a fork that has none of the NJ_* telemetry variables and no SENTRY_AUTH_TOKEN, and publishes it
# as a prerelease of the fork. `telemetry: none` compiles telemetry out (build-package.yml asserts
# no endpoint reached the binary), so the package reports nothing. No LAB=1, no devtriggers: this is
# build-package.yml's own RELEASE=1 nightly build.
#
# Before the build, the host gates the touched code needs: ci.yml's default-feature unit suite and
# python gates, and simulators.yml's native libass tests (`make check-ass`, macOS, the ignored
# pixel tests included).

on:
  push:
    branches: [fix/subtitle-script-faces, ci/body-length-32bit, ci/combined, ci/foreground-reclaim, ci/subtitle-fixes, ci/hls-trickplay]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-unit-default:
    name: host unit tests (default features)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUST_NIGHTLY: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/host-rust
        with:
          sdl: "true"
      - name: make check-cargo-unit-default
        shell: bash
        run: |
          set -o pipefail
          make check-cargo-unit-default 2>&1 | tee "$RUNNER_TEMP/make.log" || {
            # Job logs need a sign-in on a fork; annotations do not.
            grep -E 'error(\[|:)|FAILED|panicked|failures:|^test .* FAILED|\*\*\*|No such file|not found' "$RUNNER_TEMP/make.log"               | tail -60 | sed 's/^/::error::/'
            exit 1
          }

  host-unit-hostsim:
    name: host unit tests (hostsim)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_NIGHTLY: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/host-rust
        with:
          sdl: "true"
      # The app loop's lifecycle tests (`app::run::lifecycle_regression_tests`) compile only
      # under `hostsim`.
      - name: make check-cargo-unit-hostsim
        shell: bash
        run: |
          set -o pipefail
          make check-cargo-unit-hostsim 2>&1 | tee "$RUNNER_TEMP/make.log" || {
            # Job logs need a sign-in on a fork; annotations do not.
            grep -E 'error(\[|:)|FAILED|panicked|failures:|^test .* FAILED|\*\*\*|No such file|not found' "$RUNNER_TEMP/make.log"               | tail -60 | sed 's/^/::error::/'
            exit 1
          }

  host-python:
    name: host python/shell/C gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: make check-python
        shell: bash
        run: |
          set -o pipefail
          make check-python 2>&1 | tee "$RUNNER_TEMP/make.log" || {
            # Job logs need a sign-in on a fork; annotations do not.
            grep -E 'error(\[|:)|FAILED|panicked|failures:|^test .* FAILED|\*\*\*|No such file|not found' "$RUNNER_TEMP/make.log"               | tail -60 | sed 's/^/::error::/'
            exit 1
          }

  check-ass:
    name: macOS replay, FFmpeg and libass tests
    # Intel: the arm64 (macos-latest) queue left this job unacquired three runs in a row.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install SDL
        timeout-minutes: 15
        run: brew install sdl2_ttf cmake pkg-config ffmpeg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor/ffmpeg-prefix-host
            vendor/ffmpeg-build
          key: host-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/build-ffmpeg.sh') }}
      # FFmpeg source where build-ffmpeg.sh looks first (it still checks the pinned sha256).
      - name: Prefetch the FFmpeg source
        shell: bash
        run: |
          set -euo pipefail
          v=$(sed -n 's/^VERSION=//p' ci/build-ffmpeg.sh)
          sha=$(sed -n 's/^SHA256=//p' ci/build-ffmpeg.sh)
          out="vendor/ffmpeg-build/ffmpeg-$v.tar.xz"
          mkdir -p vendor/ffmpeg-build
          ok() { [ -f "$out" ] && [ "$(shasum -a 256 "$out" | cut -d' ' -f1)" = "$sha" ]; }
          curl -fsSL --max-time 120 --retry 2 --retry-all-errors --retry-delay 10 \
            "https://ffmpeg.org/releases/ffmpeg-$v.tar.xz" -o "$out" || true
          # ffmpeg.org was unreachable on 2026-11-02: fall back to a fork release's copy of the
          # same pinned tarball (verified below, and again by build-ffmpeg.sh).
          ok || curl -fsSL --max-time 300 --retry 3 --retry-all-errors --retry-delay 10 \
            "https://github.com/dorko87/native-jelly/releases/download/foreground-reclaim-v0.10.0-nightly-20261102-8/ffmpeg-$v.tar.xz" -o "$out"
          ok || { echo "::error::no FFmpeg $v tarball matching the pinned sha256"; exit 1; }
      # simulators.yml's replay: a new Settings row shifts the committed recordings' anchors.
      - name: Build native macOS simulator
        shell: bash
        run: |
          set -o pipefail
          make sim-macos SIM_TDIR=rust-modules/target-sim-ci 2>&1 | tee "$RUNNER_TEMP/sim.log" || {
            # Job logs need a sign-in on a fork; annotations do not.
            grep -E -B2 -A8 'error(\[|:)|\*\*\*|No such file|not found|command not found' "$RUNNER_TEMP/sim.log" | head -80 | sed 's/^/::error::/'
            tail -25 "$RUNNER_TEMP/sim.log" | sed 's/^/::error::tail: /'
            exit 1
          }
      - name: Replay all committed product recordings
        shell: bash
        run: |
          set -o pipefail
          python3 tests/replay_fixtures.py             --sim "$GITHUB_WORKSPACE/rust-modules/target-sim-ci/debug/nativejelly-sim"             --output "$RUNNER_TEMP/nativejelly-replay" 2>&1 | tee "$RUNNER_TEMP/replay.log" || {
            tail -60 "$RUNNER_TEMP/replay.log" | sed 's/^/::error::/'
            exit 1
          }
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Tests against the bundled FFmpeg
        shell: bash
        run: |
          set -o pipefail
          make check-ffmpeg 2>&1 | tee "$RUNNER_TEMP/make.log" || {
            # Job logs need a sign-in on a fork; annotations do not.
            grep -E 'error(\[|:)|FAILED|panicked|failures:|^test .* FAILED|\*\*\*|No such file|not found' "$RUNNER_TEMP/make.log" | tail -60 | sed 's/^/::error::/'
            exit 1
          }
      - name: Tests against the bundled ASS renderer
        shell: bash
        run: |
          set -o pipefail
          make check-ass 2>&1 | tee "$RUNNER_TEMP/make.log" || {
            # Job logs need a sign-in on a fork; annotations do not.
            grep -E 'error(\[|:)|FAILED|panicked|failures:|^test .* FAILED|\*\*\*|No such file|not found' "$RUNNER_TEMP/make.log"               | tail -60 | sed 's/^/::error::/'
            exit 1
          }

  plan:
    name: date the build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    name: ARM build + gates
    needs: [plan, host-unit-default, host-unit-hostsim, host-python, check-ass]
    uses: ./.github/workflows/build-package.yml
    with:
      ref: ${{ github.sha }}
      flavor: nightly
      nightly-date: ${{ needs.plan.outputs.date }}
      telemetry: none
      artifact: fork-assets
      # The package redistributes FFmpeg, so the LGPL corresponding source travels with it.
      source-asset: true
      fwcompat: true
      caches: false
      homebrew-manifest: false

  publish:
    name: publish fork prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan, build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-assets
          path: raw
      - name: Stage and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ needs.plan.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src=$(ls raw/com.sostk.nativejelly.nightly_*_arm.ipk)
          version=${src##*/com.sostk.nativejelly.nightly_}; version=${version%_arm.ipk}
          case "$GITHUB_REF_NAME" in
            ci/body-length-32bit) what="body-length"; about="a sized body over 4 GiB is not finished at its low 32 bits" ;;
            ci/foreground-reclaim) what="foreground-reclaim"; about="ci/combined plus reclaim of a parked session after a decoder release or a refused foreground Load" ;;
            ci/subtitle-fixes) what="subtitle-fixes"; about="ci/foreground-reclaim plus five PlxNative subtitle fixes (HDR dimming, Huge size, caption rise, retry keeps subtitles, NUL-terminated ASS)" ;;
            ci/hls-trickplay) what="hls-trickplay"; about="ci/subtitle-fixes plus Jellyfin HLS fixes for quality Auto (trickplay image streams, 16 MiB playlist cap, AAC audio)" ;;
            ci/combined) what="combined"; about="body-length fix plus bundled Noto Sans Bold subtitle faces (Hebrew and 21 other scripts)" ;;
            *) what="subtitle-faces"; about="bundled Noto Sans Bold subtitle faces (Hebrew and 21 other scripts)" ;;
          esac
          tag="${what}-v${version}-nightly-${DATE}-${GITHUB_RUN_NUMBER}"
          ipk="nativejelly-${tag}.ipk"
          cp "$src" "dist/$ipk"
          ( cd dist && sha256sum "$ipk" > "$ipk.sha256" )
          cp raw/ffmpeg-*.tar.xz raw/build-ffmpeg.sh raw/nativejelly-source-*.tar.gz* dist/
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Native Jelly $tag (fork build, no telemetry)" \
            --prerelease \
            --latest=false \
            --notes "Fork build of $GITHUB_SHA: ${about}. Nightly flavour (com.sostk.nativejelly.nightly), RELEASE=1, telemetry compiled out. sha256: $(cut -d' ' -f1 "dist/$ipk.sha256")"
          {
            echo "### $tag"
            echo "- ipk: $ipk"
            echo "- sha256: $(cut -d' ' -f1 "dist/$ipk.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"
